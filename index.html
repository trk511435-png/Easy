<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy | Next-Gen Crypto & Bank Wallet</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --card-bg: rgba(17, 24, 39, 0.75);
            --border-glow: rgba(59, 130, 246, 0.2);
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --accent-hover: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 6px;
        }

        .logo-icon {
            background: var(--accent-gradient);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }

        .tagline {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Form Controls */
        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.5);
        }

        .btn-outline {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Dashboard Styles */
        #dashboardSection, #authSection { display: none; }
        #authSection.active, #dashboardSection.active { display: block; }

        .balance-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(16, 185, 129, 0.1) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .balance-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .balance-val {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .info-card {
            background: rgba(3, 7, 18, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .info-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 700;
            color: #60a5fa;
            word-break: break-all;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- الهيدر -->
        <div class="brand-header">
            <div class="logo-area">
                <div class="logo-icon">⚡</div>
                <span>Easy Bank</span>
            </div>
            <div class="tagline">منظومة الحسابات الرقمية الآمنة والمشفرة</div>
        </div>

        <!-- قسم الدخول والتسجيل -->
        <div id="authSection" class="active">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput" placeholder="أدخل اسمك (مثال: Salem)">
            </div>
            <div class="input-group">
                <label>كلمة المرور الآمنة</label>
                <input type="password" id="passwordInput" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="handleAuth('/api/register')">إنشاء حساب جديد</button>
            <button class="btn-outline" onclick="handleAuth('/api/login')">تسجيل الدخول</button>
        </div>

        <!-- لوحة التحكم الاحترافية للمستخدم -->
        <div id="dashboardSection">
            <div class="balance-box">
                <div class="balance-label">إجمالي الرصيد المتاح</div>
                <div class="balance-val" id="balanceDisplay">$0.00</div>
            </div>

            <div class="info-card">
                <div class="info-title">معرف المستخدم الأساسي (User ID)</div>
                <div class="info-value" id="userIdDisplay">-</div>
            </div>

            <div class="info-card">
                <div class="info-title">الحساب الفرعي (Sub-Account)</div>
                <div class="info-value" id="subAccountDisplay">-</div>
            </div>

            <div class="info-card">
                <div class="info-title">عنوان المحفظة الآمن (Custodial Address)</div>
                <div class="info-value" id="walletAddressDisplay" style="font-size: 12px; color: #34d399;">-</div>
            </div>

            <div class="divider"></div>

            <button class="btn-outline" onclick="logout()" style="color: #f87171; border-color: rgba(248, 113, 113, 0.3);">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        // رابط سيرفرك الفعلي على Render
        const SERVER_URL = "https://easy-qrgz.onrender.com";

        window.onload = () => {
            const savedUser = localStorage.getItem('easy_user');
            if (savedUser) {
                showDashboard(JSON.parse(savedUser));
            }
        };

        async function handleAuth(endpoint) {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!username || !password) {
                alert("الرجاء إدخال اسم المستخدم وكلمة المرور بدقة!");
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('easy_user', JSON.stringify(data));
                    showDashboard(data);
                } else {
                    alert(data.error || "حدث خطأ ما، تأكد من البيانات.");
                }
            } catch (error) {
                alert("تعذر الاتصال بالسيرفر السحابي. حاول مرة أخرى.");
            }
        }

        function showDashboard(data) {
            document.getElementById('authSection').classList.remove('active');
            document.getElementById('dashboardSection').classList.add('active');

            document.getElementById('userIdDisplay').innerText = data.userId;
            document.getElementById('subAccountDisplay').innerText = data.subAccountId;
            document.getElementById('walletAddressDisplay').innerText = data.walletAddress;
            document.getElementById('balanceDisplay').innerText = `$${data.balance.toFixed(2)}`;
        }

        function logout() {
            localStorage.removeItem('easy_user');
            location.reload();
        }
    </script>
</body>
</html>
