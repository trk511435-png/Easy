<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy - Next Gen Custodial Wallet</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
        }
        .badge {
            background-color: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .balance-card {
            background: linear-gradient(135deg, #1f6feb 0%, #1158c7 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }
        .balance-title { font-size: 14px; color: #b3d7ff; margin-bottom: 6px; }
        .balance-amount { font-size: 28px; font-weight: bold; color: #fff; }
        
        .section-title { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--text-muted); }
        .info-box {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            font-size: 13px;
            word-break: break-all;
        }
        .info-box span { color: #58a6ff; font-weight: bold; }
        
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #58a6ff; }
        
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: #30363d; }
        .btn-secondary:hover { background-color: #3b434b; }
        
        #dashboardSection, #authSection { display: none; }
        #authSection.active, #dashboardSection.active { display: block; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">Easy ⚡</div>
            <div class="badge">Secure Custodial</div>
        </div>

        <!-- قسم تسجيل الدخول / إنشاء حساب -->
        <div id="authSection" class="active">
            <div class="section-title">تسجيل الدخول أو حساب جديد</div>
            <input type="text" id="usernameInput" placeholder="اسم المستخدم (مثال: Salem)">
            <input type="password" id="passwordInput" placeholder="كلمة المرور">
            <button class="btn" onclick="handleAuth('/api/register')">إنشاء حساب جديد</button>
            <button class="btn btn-secondary" onclick="handleAuth('/api/login')">تسجيل الدخول من جهاز آخر</button>
        </div>

        <!-- قسم لوحة التحكم بعد تسجيل الدخول -->
        <div id="dashboardSection">
            <div class="balance-card" id="balanceCard">
                <div class="balance-title">إجمالي الرصيد المحفوظ</div>
                <div class="balance-amount" id="balanceDisplay">$0.00</div>
            </div>

            <div class="section-title">بيانات الحساب والهوية</div>
            <div class="info-box">معرف المستخدم الأساسي: <span id="userIdDisplay">-</span></div>
            <div class="info-box">الحساب الفرعي (شامل): <span id="subAccountDisplay">-</span></div>
            <div class="info-box" id="metamaskBox" style="display:none;">محفظة MetaMask المربوطة: <span id="metamaskDisplay">-</span></div>

            <button class="btn" onclick="connectMetaMask()">ربط محفظة MetaMask (إصدار حساب فرعي إضافي)</button>
            <button class="btn btn-secondary" onclick="logout()">تسجيل الخروج</button>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://easy-qrgz.onrender.com";

        // التحقق إذا كان المستخدم مسجل مسبقاً في المتصفح
        window.onload = () => {
            const savedUser = localStorage.getItem('easy_user');
            if (savedUser) {
                const data = JSON.parse(savedUser);
                showDashboard(data);
            }
        };

        async function handleAuth(endpoint) {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!username || !password) {
                alert("الرجاء إدخال اسم المستخدم وكلمة المرور!");
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('easy_user', JSON.stringify(data));
                    showDashboard(data);
                } else {
                    alert(data.error);
                }
            } catch (error) {
                alert("تعذر الاتصال بالسيرفر السحابي.");
            }
        }

        function showDashboard(data) {
            document.getElementById('authSection').classList.remove('active');
            document.getElementById('dashboardSection').classList.add('active');
            document.getElementById('balanceCard').style.display = 'block';

            document.getElementById('userIdDisplay').innerText = data.userId;
            document.getElementById('subAccountDisplay').innerText = data.subAccountId;
            document.getElementById('balanceDisplay').innerText = `$${data.balance.toLocaleString()}`;
        }

        function logout() {
            localStorage.removeItem('easy_user');
            location.reload();
        }

        // دالة ربط محفظة ميتا ماسك وإنشاء حساب فرعي إضافي تابع للمنصة
        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const walletAddress = accounts[0];
                    
                    // إظهار المحفظة المربوطة في الواجهة
                    document.getElementById('metamaskBox').style.display = 'block';
                    document.getElementById('metamaskDisplay').innerText = walletAddress;
                    
                    alert("تم ربط عنوان محفظة MetaMask بنجاح، وأصبح مرتبطاً بحسابك الفرعي في منصة Easy!");
                } catch (error) {
                    alert("تم رفض الاتصال بالمحفظة.");
                }
            } else {
                alert("تطبيق MetaMask غير مثبت في متصفحك.");
            }
        }
    </script>
</body>
</html>
