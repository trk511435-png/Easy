<<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy - Next Gen Wallet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #070709;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 410px;
            height: 860px;
            background: linear-gradient(180deg, #111116 0%, #09090c 100%);
            border-radius: 44px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border: 1px solid #22222b;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* الهيدر مع اسم المنصة الواضح */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .icon-btn {
            background: #18181f;
            border: 1px solid #2a2a35;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #a1a1aa;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            background: #2a2a35;
            color: #fff;
        }

        /* شريط اختيار العملات والشبكات السريع */
        .assets-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            margin-top: 15px;
        }

        .asset-chip {
            background: #18181f;
            border: 1px solid #2a2a35;
            padding: 8px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            color: #a1a1aa;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .asset-chip.active {
            background: #ffffff;
            color: #070709;
            border-color: #ffffff;
        }

        /* بطاقة المحفظة الفخمة المتعددة */
        .crypto-card {
            background: linear-gradient(135deg, #1f1f28 0%, #101015 100%);
            border: 1px solid #32323f;
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            margin-top: 5px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-name {
            font-size: 14px;
            color: #8b8b97;
            font-weight: 500;
        }

        .networks-wrapper {
            display: flex;
            gap: 6px;
        }

        .network-tag {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .balance-area {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .balance-num {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .balance-unit {
            font-size: 18px;
            color: #71717a;
            font-weight: 600;
        }

        /* أزرار الإجراءات الفخمة (Send / Receive) */
        .action-buttons {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-circle {
            width: 64px;
            height: 64px;
            background: linear-gradient(145deg, #1c1c24, #121217);
            border: 1px solid #2e2e3a;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, border-color 0.2s;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .action-circle:hover {
            transform: translateY(-3px);
            background: #252530;
            border-color: #525266;
        }

        .action-label {
            font-size: 13px;
            color: #a1a1aa;
            font-weight: 500;
        }

        /* قسم السجل */
        .history-box {
            flex-grow: 1;
            background: #121217;
            border: 1px dashed #262630;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            margin: 10px 0;
        }

        .history-icon {
            font-size: 30px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .history-text {
            font-size: 14px;
            color: #71717a;
        }

        /* زر التمويل السفلي البارز */
        .main-cta-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
            color: #070709;
            border: none;
            padding: 16px;
            border-radius: 22px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.12);
            text-align: center;
        }

        .main-cta-btn:hover {
            opacity: 0.92;
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر مع اسم المنصة البارز Easy -->
        <div class="app-header">
            <button class="icon-btn">👤</button>
            <div class="brand-title">Easy</div>
            <button class="icon-btn">⚙️</button>
        </div>

        <!-- شريط العملات والشبكات المتعددة -->
        <div class="assets-bar">
            <div class="asset-chip active">💎 USDT</div>
            <div class="asset-chip">🔹 ETH</div>
            <div class="asset-chip">🟡 BTC</div>
            <div class="asset-chip">🟣 SOL</div>
            <div class="asset-chip">🌐 TRC-20</div>
        </div>

        <!-- بطاقة المحفظة الفخمة -->
        <div class="crypto-card">
            <div class="card-top">
                <span class="card-name">Unified Vault</span>
                <div class="networks-wrapper">
                    <span class="network-tag">Multi-Chain</span>
                </div>
            </div>
            <div class="balance-area">
                <span class="balance-num">0.00</span>
                <span class="balance-unit">USDT</span>
            </div>
        </div>

        <!-- أزرار العمليات (Send / Receive) -->
        <div class="action-buttons">
            <div class="action-group">
                <div class="action-circle">📥</div>
                <span class="action-label">Receive</span>
            </div>
            <div class="action-group">
                <div class="action-circle">📤</div>
                <span class="action-label">Send</span>
            </div>
        </div>

        <!-- سجل المعاملات -->
        <div class="history-box">
            <div class="history-icon">⚡</div>
            <div class="history-text">No transactions yet</div>
        </div>

        <!-- زر التمويل الأساسي -->
        <button class="main-cta-btn">Fund your wallet</button>
    </div>

</body>
</html>
