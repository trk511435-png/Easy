<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy - Digital Wallet</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 840px;
            background-color: #121216;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid #27272a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* شريط العلوي للتطبيق */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .icon-btn {
            background: #1c1c21;
            border: 1px solid #2d2d35;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #a1a1aa;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: #2d2d35;
            color: #fff;
        }

        .wallet-selector {
            font-size: 16px;
            font-weight: 600;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* بطاقة المحفظة الفخمة */
        .crypto-card {
            background: linear-gradient(135deg, #27272f 0%, #161619 100%);
            border: 1px solid #3f3f46;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            position: relative;
            margin-top: 10px;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-name {
            font-size: 15px;
            color: #a1a1aa;
            font-weight: 500;
        }

        .network-tag {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .balance-area {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .balance-num {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -1px;
            color: #ffffff;
        }

        .balance-unit {
            font-size: 18px;
            color: #71717a;
            font-weight: 600;
        }

        /* أزرار الإجراءات السريعة (Send / Receive) */
        .action-buttons {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .action-circle {
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #1c1c21, #141417);
            border: 1px solid #2d2d35;
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: #ffffff;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .action-circle:hover {
            transform: translateY(-3px);
            background: #27272f;
            border-color: #52525b;
        }

        .action-label {
            font-size: 13px;
            color: #a1a1aa;
            font-weight: 500;
        }

        /* قسم السجل والفراغ */
        .history-box {
            flex-grow: 1;
            background: #161619;
            border: 1px dashed #27272a;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            margin: 10px 0;
        }

        .history-icon {
            font-size: 28px;
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .history-text {
            font-size: 14px;
            color: #71717a;
        }

        /* زر التمويل السفلي البارز */
        .main-cta-btn {
            width: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
            color: #0b0b0e;
            border: none;
            padding: 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .main-cta-btn:hover {
            opacity: 0.9;
            transform: scale(0.99);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر -->
        <div class="app-header">
            <button class="icon-btn">👤</button>
            <div class="wallet-selector">
                <span>Easy Main</span>
                <span style="font-size: 12px; color: #71717a;">▼</span>
            </div>
            <button class="icon-btn">⚙️</button>
        </div>

        <!-- البطاقة البصرية الفخمة -->
        <div class="crypto-card">
            <div class="card-top">
                <span class="card-name">Main Account</span>
                <span class="network-tag">● TRC-20</span>
            </div>
            <div class="balance-area">
                <span class="balance-num">0.00</span>
                <span class="balance-unit">USDT</span>
            </div>
        </div>

        <!-- أزرار الإرسال والاستلام -->
        <div class="action-buttons">
            <div class="action-group">
                <div class="action-circle">📥</div>
                <span class="action-label">Receive</span>
            </div>
            <div class="action-group">
                <div class="action-circle">📤</div>
                <span class="action-label">Send</span>
            </div>
        </div>

        <!-- سجل المعاملات -->
        <div class="history-box">
            <div class="history-icon">⚡</div>
            <div class="history-text">No transactions yet</div>
        </div>

        <!-- زر التمويل الأساسي -->
        <button class="main-cta-btn">Fund your wallet</button>
    </div>

></body>
</html>
