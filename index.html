<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy - Next Gen Custodial Wallet</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        .badge {
            background-color: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .balance-card {
            background: linear-gradient(135deg, #1f6feb 0%, #1158c7 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .balance-title {
            font-size: 14px;
            color: #b3d7ff;
            margin-bottom: 6px;
        }
        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-muted);
        }
        .info-box {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 13px;
            word-break: break-all;
        }
        .info-box span {
            color: #58a6ff;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .btn-secondary {
            background-color: #30363d;
        }
        .btn-secondary:hover {
            background-color: #3b434b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">Easy ⚡</div>
            <div class="badge">Custodial Mode</div>
        </div>

        <div class="balance-card">
            <div class="balance-title">إجمالي الرصيد المحفوظ</div>
            <div class="balance-amount">$12,450.00</div>
        </div>

        <div class="section-title">بيانات الحساب والهوية</div>
        <div class="info-box">
            معرف المستخدم الأساسي: <span id="userIdDisplay">جاري التوليد...</span>
        </div>
        <div class="info-box">
            الحساب الفرعي النشط: <span id="subAccountDisplay">جاري التحميل...</span>
        </div>

        <div class="section-title">إدارة المحفظة</div>
        <input type="text" id="usernameInput" placeholder="أدخل اسمك الكريم (مثال: Salem)">
        <button class="btn" onclick="registerUser()">إنشاء الحساب والمعرفات</button>
        <button class="btn btn-secondary" onclick="connectMetaMask()">ربط محفظة MetaMask (تحكم جزئي)</button>
    </div>

    <script>
        // الاتصال بالسيرفر السحابي الخاص بك على Render
        const SERVER_URL = "https://easy-qrgz.onrender.com";

        async function registerUser() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                alert("الرجاء إدخال الاسم أولاً!");
                return;
            }

            try {
                const response = await fetch(`${SERVER_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await response.json();
                
                if(response.ok) {
                    document.getElementById('userIdDisplay').innerText = data.userId;
                    document.getElementById('subAccountDisplay').innerText = data.subAccountId;
                    alert("تم إنشاء حسابك ومعرفاتك بنجاح في نظام Easy السحابي!");
                } else {
                    alert("خطأ: " + data.error);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("تعذر الاتصال بالسيرفر السحابي. تأكد من عمل السيرفر.");
            }
        }

        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const walletAddress = accounts[0];
                    document.getElementById('subAccountDisplay').innerText = walletAddress.substring(0, 10) + "... (Custodial Linked)";
                    alert("تم ربط المحفظة الإضافية بنجاح بنظام منصتك!");
                } catch (error) {
                    alert("تم إلغاء الاتصال بواسطة المستخدم.");
                }
            } else {
                alert("تطبيق MetaMask غير مثبت متصفحك أو جهازك.");
            }
        }
    </script>
</body>
</html>
